<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0910">
  <title>STATIONI — Prototype mobile</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/stationi/lucide.js"></script>
  <style>
    html, body { min-height: 100%; margin: 0; background: #08080A; }
    body { overflow-x: hidden; }
    button, input, select { font: inherit; }
  </style>
</head>
<body>
<div id="stationi-ui-concept" data-theme="light">
  <style>
    #stationi-ui-concept {
      --stationi-purple: #735EA9;
      --stationi-purple-deep: #5C478E;
      --stationi-purple-soft: #E8E1F6;
      --stationi-canvas: #F7F6FA;
      --stationi-surface: #FFFFFF;
      --stationi-surface-raised: #F1EEF6;
      --stationi-text: #111016;
      --stationi-text-2: #65606D;
      --stationi-text-3: #77717F;
      --stationi-border: #E5E1EA;
      --stationi-border-strong: #8D8698;
      --stationi-mark-main: #111016;
      --stationi-green: #137A55;
      --stationi-green-soft: #E2F2EC;
      --stationi-amber: #9A5B00;
      --stationi-amber-soft: #FFF0D7;
      --stationi-red: #B73542;
      --stationi-red-soft: #FBE5E8;
      --stationi-blue: #2D64C8;
      --stationi-map-filter: grayscale(.30) saturate(.72) brightness(1.05);
      --stationi-shadow: 0 18px 50px rgba(12, 10, 18, .12);
      font-family: Inter, Arial, sans-serif;
      color: var(--stationi-text);
      width: 100%;
    }

    #stationi-ui-concept[data-theme="dark"] {
      --stationi-purple-soft: #2B2140;
      --stationi-canvas: #0B0910;
      --stationi-surface: #14111A;
      --stationi-surface-raised: #1D1925;
      --stationi-text: #FAF9FC;
      --stationi-text-2: #B9B2C2;
      --stationi-text-3: #91899C;
      --stationi-border: #302A3A;
      --stationi-border-strong: #71697E;
      --stationi-mark-main: #FFFFFF;
      --stationi-green: #6FDCB2;
      --stationi-green-soft: #15352B;
      --stationi-amber: #FFC46B;
      --stationi-amber-soft: #3B2A10;
      --stationi-red: #FF8891;
      --stationi-red-soft: #3B1A20;
      --stationi-blue: #78A9FF;
      --stationi-map-filter: invert(.88) hue-rotate(178deg) saturate(.50) brightness(.52) contrast(1.22);
      --stationi-shadow: 0 20px 55px rgba(0, 0, 0, .38);
    }

    #stationi-ui-concept *,
    #stationi-ui-concept *::before,
    #stationi-ui-concept *::after { box-sizing: border-box; }

    #stationi-ui-concept .stationi-gallery-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 20px;
    }

    #stationi-ui-concept .stationi-gallery-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--foreground);
      font-weight: 500;
    }

    #stationi-ui-concept .stationi-gallery-heading svg { color: #735EA9; }
    #stationi-ui-concept .stationi-mode-controls { display: flex; gap: 8px; }
    #stationi-ui-concept .stationi-screen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(390px, 100%), 1fr));
      gap: 30px 22px;
      align-items: start;
    }

    #stationi-ui-concept .stationi-frame {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #stationi-ui-concept .stationi-frame-label {
      width: min(390px, 100%);
      display: flex;
      justify-content: space-between;
      color: var(--foreground);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .02em;
    }

    #stationi-ui-concept .stationi-frame-label span { color: var(--muted-foreground); }

    #stationi-ui-concept .stationi-phone {
      position: relative;
      width: min(390px, 100%);
      height: 844px;
      overflow: hidden;
      border-radius: 42px;
      border: 1px solid var(--stationi-border);
      background: var(--stationi-canvas);
      color: var(--stationi-text);
      box-shadow: var(--stationi-shadow);
      font-size: 14px;
      line-height: 1.35;
      isolation: isolate;
    }

    #stationi-ui-concept .stationi-phone button,
    #stationi-ui-concept .stationi-phone input {
      font: inherit;
    }

    #stationi-ui-concept .stationi-status {
      position: absolute;
      inset: 0 0 auto;
      height: 30px;
      padding: 9px 24px 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: var(--stationi-text);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .01em;
      pointer-events: none;
    }

    #stationi-ui-concept .stationi-status-icons { display: flex; align-items: center; gap: 5px; }
    #stationi-ui-concept .stationi-status-icons i { width: 13px; height: 13px; }

    #stationi-ui-concept .stationi-main {
      position: absolute;
      inset: 30px 0 74px;
      overflow: hidden;
    }

    #stationi-ui-concept .stationi-phone.no-nav .stationi-main { bottom: 0; }

    #stationi-ui-concept .stationi-scroll {
      height: 100%;
      padding: 14px 20px 24px;
      overflow: hidden;
    }

    #stationi-ui-concept .stationi-app-header {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    #stationi-ui-concept .stationi-header-title { min-width: 0; }
    #stationi-ui-concept .stationi-eyebrow {
      margin: 0 0 3px;
      color: var(--stationi-text-3);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    #stationi-ui-concept .stationi-app-header h2,
    #stationi-ui-concept .stationi-screen-title,
    #stationi-ui-concept .stationi-section-title {
      font-family: Sztos, Inter, Arial, sans-serif;
      color: var(--stationi-text);
      margin: 0;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    #stationi-ui-concept .stationi-app-header h2 { font-size: 22px; }
    #stationi-ui-concept .stationi-screen-title { font-size: 29px; line-height: 1.08; }
    #stationi-ui-concept .stationi-section-title { font-size: 18px; }

    #stationi-ui-concept .stationi-icon-button {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 0;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: var(--stationi-surface);
      color: var(--stationi-text);
      box-shadow: 0 8px 24px rgba(12, 10, 18, .10);
    }

    #stationi-ui-concept[data-theme="dark"] .stationi-icon-button { box-shadow: none; }
    #stationi-ui-concept .stationi-icon-button i { width: 21px; height: 21px; }

    #stationi-ui-concept .stationi-primary,
    #stationi-ui-concept .stationi-secondary,
    #stationi-ui-concept .stationi-ghost {
      min-height: 52px;
      border-radius: 14px;
      padding: 0 18px;
      border: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 600;
      text-align: center;
    }

    #stationi-ui-concept .stationi-primary { background: var(--stationi-purple); color: #FFFFFF; }
    #stationi-ui-concept .stationi-secondary { background: var(--stationi-surface-raised); color: var(--stationi-text); }
    #stationi-ui-concept .stationi-ghost { min-height: 42px; background: transparent; color: var(--stationi-purple); }
    #stationi-ui-concept .stationi-block { width: 100%; }

    #stationi-ui-concept .stationi-card {
      background: var(--stationi-surface);
      border: 1px solid var(--stationi-border);
      border-radius: 16px;
      padding: 16px;
    }

    #stationi-ui-concept .stationi-card + .stationi-card { margin-top: 10px; }
    #stationi-ui-concept .stationi-soft-card { background: var(--stationi-surface-raised); border-color: transparent; }

    #stationi-ui-concept .stationi-row { display: flex; align-items: center; gap: 12px; }
    #stationi-ui-concept .stationi-row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #stationi-ui-concept .stationi-stack { display: grid; gap: 12px; }
    #stationi-ui-concept .stationi-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #stationi-ui-concept .stationi-grow { min-width: 0; flex: 1; }

    #stationi-ui-concept .stationi-body { margin: 0; color: var(--stationi-text-2); font-size: 14px; }
    #stationi-ui-concept .stationi-small { margin: 0; color: var(--stationi-text-2); font-size: 12px; }
    #stationi-ui-concept .stationi-caption { margin: 0; color: var(--stationi-text-3); font-size: 10px; letter-spacing: .04em; }
    #stationi-ui-concept .stationi-value { font-family: Sztos, Inter, sans-serif; font-size: 25px; font-weight: 600; letter-spacing: -.02em; }
    #stationi-ui-concept .stationi-purple-text { color: var(--stationi-purple); }
    #stationi-ui-concept[data-theme="dark"] .stationi-purple-text { color: #B8A6E8; }
    #stationi-ui-concept .stationi-green-text { color: var(--stationi-green); }
    #stationi-ui-concept .stationi-red-text { color: var(--stationi-red); }

    #stationi-ui-concept .stationi-divider { height: 1px; background: var(--stationi-border); margin: 14px 0; }
    #stationi-ui-concept .stationi-chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
    #stationi-ui-concept .stationi-chip {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--stationi-border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--stationi-surface);
      color: var(--stationi-text-2);
      font-size: 12px;
      font-weight: 500;
    }

    #stationi-ui-concept .stationi-chip.selected { background: var(--stationi-purple-soft); color: var(--stationi-purple); border-color: transparent; }
    #stationi-ui-concept[data-theme="dark"] .stationi-chip.selected { color: #D8CCF4; }
    #stationi-ui-concept .stationi-chip i { width: 14px; height: 14px; }

    #stationi-ui-concept .stationi-search {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-radius: 16px;
      background: var(--stationi-surface);
      color: var(--stationi-text-2);
      border: 1px solid var(--stationi-border);
      box-shadow: 0 10px 28px rgba(12, 10, 18, .10);
    }

    #stationi-ui-concept[data-theme="dark"] .stationi-search { box-shadow: none; }
    #stationi-ui-concept .stationi-search input { min-width: 0; flex: 1; border: 0; outline: none; color: var(--stationi-text); background: transparent; }
    #stationi-ui-concept .stationi-search input::placeholder { color: var(--stationi-text-2); opacity: 1; }

    #stationi-ui-concept .stationi-nav {
      position: absolute;
      inset: auto 0 0;
      height: 74px;
      padding: 10px 12px 11px;
      z-index: 25;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      background: color-mix(in srgb, var(--stationi-surface) 94%, transparent);
      border-top: 1px solid var(--stationi-border);
      backdrop-filter: blur(18px);
    }

    #stationi-ui-concept .stationi-nav button {
      position: relative;
      border: 0;
      background: transparent;
      color: var(--stationi-text-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 9px;
      font-weight: 600;
    }

    #stationi-ui-concept .stationi-nav button.active { color: var(--stationi-purple); }
    #stationi-ui-concept[data-theme="dark"] .stationi-nav button.active { color: #B8A6E8; }
    #stationi-ui-concept .stationi-nav button i { width: 20px; height: 20px; }
    #stationi-ui-concept .stationi-live-dot { position: absolute; top: 3px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--stationi-green); box-shadow: 0 0 0 3px var(--stationi-surface); }

    #stationi-ui-concept .stationi-map {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--stationi-surface-raised);
    }

    #stationi-ui-concept .stationi-map-image {
      position: absolute;
      inset: -3%;
      background-image: linear-gradient(color-mix(in srgb, var(--stationi-canvas) 12%, transparent), color-mix(in srgb, var(--stationi-canvas) 12%, transparent)), url("/stationi/algiers-map.jpg");
      background-size: cover;
      background-position: center;
      filter: var(--stationi-map-filter);
      opacity: .94;
      transform: scale(1.03);
    }

    #stationi-ui-concept .stationi-map-attribution { position: absolute; left: 8px; bottom: 78px; color: #4C4752; font-size: 7px; line-height: 1; text-decoration: none; background: rgba(255,255,255,.82); padding: 3px 5px; border-radius: 4px; z-index: 3; }
    #stationi-ui-concept[data-theme="dark"] .stationi-map-attribution { color: #C9C2D0; background: rgba(11,9,16,.76); }
    #stationi-ui-concept .stationi-map-top { position: absolute; inset: 16px 16px auto; z-index: 8; display: grid; gap: 10px; }
    #stationi-ui-concept .stationi-map-actions { display: flex; justify-content: flex-end; gap: 8px; }
    #stationi-ui-concept .stationi-user-dot { position: absolute; left: 49%; top: 40%; width: 18px; height: 18px; z-index: 4; border-radius: 50%; background: #63D5E6; border: 4px solid #FFFFFF; box-shadow: 0 0 0 8px rgba(99,213,230,.18); }

    #stationi-ui-concept .stationi-pin {
      position: absolute;
      z-index: 4;
      transform: translate(-50%, -100%);
      min-width: 58px;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 12px 12px 12px 2px;
      background: var(--stationi-purple);
      color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(52, 36, 80, .28);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    #stationi-ui-concept .stationi-pin.selected { min-width: 74px; height: 42px; border-radius: 15px 15px 15px 3px; outline: 3px solid rgba(255,255,255,.78); }
    #stationi-ui-concept .stationi-map-sheet {
      position: absolute;
      inset: auto 12px 10px;
      z-index: 9;
      border-radius: 24px;
      background: var(--stationi-surface);
      border: 1px solid var(--stationi-border);
      box-shadow: 0 -12px 32px rgba(12, 10, 18, .14);
      padding: 14px;
    }

    #stationi-ui-concept[data-theme="dark"] .stationi-map-sheet { box-shadow: 0 -16px 40px rgba(0,0,0,.38); }
    #stationi-ui-concept .stationi-sheet-handle { width: 38px; height: 4px; border-radius: 999px; background: var(--stationi-border-strong); opacity: .5; margin: 0 auto 12px; }

    #stationi-ui-concept .stationi-availability {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--stationi-green);
      font-size: 12px;
      font-weight: 600;
    }

    #stationi-ui-concept .stationi-availability::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    #stationi-ui-concept .stationi-parking-row { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; }
    #stationi-ui-concept .stationi-place-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: var(--stationi-purple-soft); color: var(--stationi-purple); }
    #stationi-ui-concept[data-theme="dark"] .stationi-place-icon { color: #D8CCF4; }
    #stationi-ui-concept .stationi-place-icon i { width: 22px; height: 22px; }
    #stationi-ui-concept .stationi-price { text-align: right; font-family: Sztos, Inter, sans-serif; font-size: 17px; font-weight: 600; white-space: nowrap; }

    #stationi-ui-concept .stationi-input {
      min-height: 54px;
      border: 1px solid var(--stationi-border-strong);
      border-radius: 13px;
      padding: 9px 13px;
      background: var(--stationi-surface);
      display: grid;
      align-content: center;
      gap: 2px;
    }

    #stationi-ui-concept .stationi-input label { font-size: 10px; color: var(--stationi-text-3); }
    #stationi-ui-concept .stationi-input strong { font-size: 14px; }
    #stationi-ui-concept .stationi-toggle { width: 42px; height: 24px; border-radius: 999px; background: var(--stationi-border-strong); padding: 3px; flex: 0 0 auto; }
    #stationi-ui-concept .stationi-toggle.on { background: var(--stationi-purple); }
    #stationi-ui-concept .stationi-toggle::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; transform: translateX(0); }
    #stationi-ui-concept .stationi-toggle.on::after { transform: translateX(18px); }

    #stationi-ui-concept .stationi-hero-gradient {
      background: radial-gradient(circle at 74% 20%, rgba(168,139,234,.62), transparent 30%), radial-gradient(circle at 24% 78%, rgba(99,213,230,.20), transparent 28%), linear-gradient(145deg, #0D0A17 0%, #261749 54%, #735EA9 122%);
      color: #FFFFFF;
    }

    #stationi-ui-concept .stationi-brand-lockup { display: flex; align-items: center; gap: 11px; }
    #stationi-ui-concept .stationi-brand-word { font-family: Sztos, Inter, sans-serif; font-size: 20px; font-weight: 600; letter-spacing: .015em; }
    #stationi-ui-concept .stationi-mark { display: block; flex: 0 0 auto; }
    #stationi-ui-concept .stationi-mark-main { fill: var(--stationi-mark-main); }
    #stationi-ui-concept .stationi-mark-accent { fill: var(--stationi-purple); }
    #stationi-ui-concept .on-gradient .stationi-mark-main { fill: #FFFFFF; }
    #stationi-ui-concept .stationi-mark.on-gradient .stationi-mark-main { fill: #FFFFFF; }

    #stationi-ui-concept .stationi-feature-list { display: grid; gap: 11px; }
    #stationi-ui-concept .stationi-feature { display: flex; gap: 11px; align-items: flex-start; }
    #stationi-ui-concept .stationi-feature-icon { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 11px; display: grid; place-items: center; background: rgba(255,255,255,.12); color: #FFFFFF; }
    #stationi-ui-concept .stationi-feature-icon i { width: 18px; height: 18px; }

    #stationi-ui-concept .stationi-otp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    #stationi-ui-concept .stationi-otp span { height: 54px; border-radius: 13px; display: grid; place-items: center; background: var(--stationi-surface); border: 1px solid var(--stationi-border-strong); font-size: 22px; font-weight: 600; }

    #stationi-ui-concept .stationi-permission-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--stationi-purple-soft); color: var(--stationi-purple); }
    #stationi-ui-concept[data-theme="dark"] .stationi-permission-icon { color: #D8CCF4; }

    #stationi-ui-concept .stationi-range { height: 6px; border-radius: 999px; background: var(--stationi-border); position: relative; margin: 15px 3px; }
    #stationi-ui-concept .stationi-range::before { content: ""; position: absolute; left: 0; top: 0; width: 64%; height: 100%; border-radius: inherit; background: var(--stationi-purple); }
    #stationi-ui-concept .stationi-range::after { content: ""; position: absolute; left: 61%; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: var(--stationi-purple); border: 4px solid var(--stationi-surface); transform: translateY(-50%); box-shadow: 0 2px 8px rgba(0,0,0,.18); }

    #stationi-ui-concept .stationi-detail-hero { height: 214px; position: relative; overflow: hidden; background: linear-gradient(135deg, #16111F, #38245F); }
    #stationi-ui-concept .stationi-detail-hero::before { content: ""; position: absolute; width: 250px; height: 250px; right: -60px; top: -80px; border-radius: 50%; background: radial-gradient(circle, rgba(168,139,234,.75), rgba(115,94,169,.10) 64%, transparent 65%); }
    #stationi-ui-concept .stationi-detail-lines { position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 44px, rgba(255,255,255,.05) 45px 46px); }
    #stationi-ui-concept .stationi-detail-badge { position: absolute; left: 20px; bottom: 18px; min-height: 34px; padding: 0 12px; display: inline-flex; align-items: center; gap: 7px; color: #FFFFFF; background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; font-size: 12px; }

    #stationi-ui-concept .stationi-bay-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    #stationi-ui-concept .stationi-bay { height: 62px; border-radius: 10px; display: grid; place-items: center; background: var(--stationi-green-soft); color: var(--stationi-green); border: 1px solid color-mix(in srgb, var(--stationi-green) 24%, transparent); font-size: 11px; font-weight: 700; }
    #stationi-ui-concept .stationi-bay.busy { background: var(--stationi-surface-raised); color: var(--stationi-text-3); border-color: var(--stationi-border); }
    #stationi-ui-concept .stationi-bay.selected { background: var(--stationi-purple); color: #FFFFFF; border-color: transparent; }

    #stationi-ui-concept .stationi-time-card { text-align: center; padding: 18px; }
    #stationi-ui-concept .stationi-time { font-family: Sztos, Inter, sans-serif; font-size: 38px; font-weight: 600; letter-spacing: -.03em; }
    #stationi-ui-concept .stationi-stepper { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
    #stationi-ui-concept .stationi-stepper button { width: 44px; height: 44px; border: 0; border-radius: 13px; background: var(--stationi-surface-raised); color: var(--stationi-text); font-size: 22px; }

    #stationi-ui-concept .stationi-vehicle { position: relative; overflow: hidden; }
    #stationi-ui-concept .stationi-vehicle.selected { border-color: var(--stationi-purple); box-shadow: inset 0 0 0 1px var(--stationi-purple); }
    #stationi-ui-concept .stationi-vehicle-shape { width: 64px; height: 33px; border-radius: 21px 28px 12px 12px; background: linear-gradient(145deg, #B7A6E5, #735EA9); position: relative; }
    #stationi-ui-concept .stationi-vehicle-shape::before, #stationi-ui-concept .stationi-vehicle-shape::after { content: ""; position: absolute; width: 12px; height: 12px; bottom: -5px; border-radius: 50%; background: #17141C; border: 3px solid #6F6877; }
    #stationi-ui-concept .stationi-vehicle-shape::before { left: 9px; }
    #stationi-ui-concept .stationi-vehicle-shape::after { right: 9px; }

        picker.value = String(currentIndex);
        previousButton.disabled = currentIndex === 0 && history.length === 0;
        nextButton.disabled = currentIndex === screens.length - 1;
        globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16, "stroke-width": 1.8 } });
        document.title = `${String(currentIndex + 1).padStart(2, "0")} · ${screen.title} — STATIONI`;
      };

      const renderWithMotion = (motion = "forward") => {
        if (motionIsReduced()) {
          render();
          return;
        }

        const activeFrame = grid.querySelector(".stationi-frame:not([aria-hidden='true'])");
        const outgoingFrame = activeFrame?.cloneNode(true);
        render(`is-enter-${motion}`);

        if (!outgoingFrame) return;
        outgoingFrame.className = `stationi-frame is-exit-${motion}`;
        outgoingFrame.setAttribute("aria-hidden", "true");
        outgoingFrame.querySelectorAll("[id]").forEach((element) => element.removeAttribute("id"));
        if ("inert" in outgoingFrame) outgoingFrame.inert = true;
        grid.appendChild(outgoingFrame);

        const removeOutgoing = () => outgoingFrame.remove();
        outgoingFrame.addEventListener("animationend", removeOutgoing, { once: true });
        setTimeout(removeOutgoing, 480);
      };

      const navigate = (index, push = true) => {
        const nextIndex = Math.max(0, Math.min(screens.length - 1, Number(index)));
        if (nextIndex === currentIndex) return;
        if (push) history.push(currentIndex);
        const distance = Math.abs(nextIndex - currentIndex);
        const motion = distance > 2 ? "jump" : nextIndex > currentIndex ? "forward" : "backward";
        currentIndex = nextIndex;
        renderWithMotion(motion);
        window.scrollTo({ top: 0, behavior: motionIsReduced() ? "auto" : "smooth" });
      };

      const goBack = () => {
        if (history.length) navigate(history.pop(), false);
        else navigate(Math.max(0, currentIndex - 1), false);
      };

      const applyTheme = (theme, persist = true) => {
        const hasRenderedScreen = Boolean(grid.querySelector(".stationi-frame"));
        root.dataset.theme = theme;
        root.querySelectorAll("[data-stationi-theme]").forEach((candidate) => {
          const active = candidate.dataset.stationiTheme === theme;
          candidate.setAttribute("aria-pressed", String(active));
          candidate.classList.toggle("btn-primary", active);
        });
        if (persist) localStorage.setItem("stationi-theme", theme);
        if (hasRenderedScreen && !motionIsReduced()) render("is-theme-enter");
        else render();
      };

      const sessionDestination = () => {
        if (sessionState === "reserved") return 12;
        if (sessionState === "navigating") return 14;
        if (sessionState === "active") return 15;
        if (sessionState === "completed") return 17;
        return 20;
      };

      root.querySelectorAll("[data-stationi-theme]").forEach((button) => {
        button.addEventListener("click", () => applyTheme(button.dataset.stationiTheme));
      });

      picker.addEventListener("change", () => navigate(Number(picker.value)));
      previousButton.addEventListener("click", goBack);
      nextButton.addEventListener("click", () => navigate(currentIndex + 1));

      grid.addEventListener("focusin", (event) => {
        if (currentIndex === 3 && event.target.matches(".stationi-search input")) navigate(4);
      });

      grid.addEventListener("click", (event) => {
        if (event.target.closest("a")) return;

        const button = event.target.closest("button");
        const card = event.target.closest(".stationi-card");
        const parkingRowElement = event.target.closest(".stationi-parking-row");
        const menuRowElement = event.target.closest(".stationi-menu-row");
        const navButton = event.target.closest(".stationi-nav button");
        const label = normalize(button?.textContent || event.target.textContent || "");
        const aria = button?.getAttribute("aria-label") || "";

        const toggle = event.target.closest(".stationi-toggle");
        if (toggle) {
          toggle.classList.toggle("on");
          showToast(toggle.classList.contains("on") ? "Option activée" : "Option désactivée");
          return;
        }

        const bay = event.target.closest(".stationi-bay");
        if (bay) {
          if (bay.classList.contains("busy")) showToast("Cette place est occupée");
          else {
            grid.querySelectorAll(".stationi-bay").forEach((item) => item.classList.remove("selected"));
            bay.classList.add("selected");
            showToast(`${bay.textContent.trim()} sélectionnée`);
          }
          return;
        }

        const star = event.target.closest(".stationi-stars button");
        if (star) {
          const stars = [...grid.querySelectorAll(".stationi-stars button")];
          const rating = stars.indexOf(star) + 1;
          stars.forEach((item, index) => item.classList.toggle("selected", index < rating));
          showToast(`${rating} étoile${rating > 1 ? "s" : ""}`);
          return;
        }

        const segment = event.target.closest(".stationi-segmented button");
        if (segment) {
          segment.parentElement.querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === segment));
          showToast(`${normalize(segment.textContent)} sélectionné`);
          return;
        }

        const chip = event.target.closest(".stationi-chip");
        if (chip && !chip.closest(".stationi-map-sheet")) {
          chip.classList.toggle("selected");
          return;
        }

        if (navButton) {
          const destination = { Carte: 3, Favoris: 19, Session: sessionDestination(), "Activité": 20, Profil: 22 }[aria];
          if (destination !== undefined) navigate(destination);
          return;
        }

        if (aria === "Retour") {
          goBack();
          return;
        }

        if (aria === "Menu") {
          if (currentIndex === 22) navigate(21);
          else showToast("Menu du prototype");
          return;
        }

        if (aria === "Action") {
          if (currentIndex === 4) navigate(3);
          else if (currentIndex === 6) navigate(3);
          else if (currentIndex === 19) navigate(4);
          else if (currentIndex === 21) showToast("Toutes les notifications sont lues");
          else if (currentIndex === 22) navigate(23);
          else showToast("Action effectuée");
          return;
        }

        if (currentIndex === 0 && button) navigate(1);
        else if (currentIndex === 1 && label.includes("Recevoir le code")) navigate(2);
        else if (currentIndex === 1 && label.includes("Renvoyer")) showToast("Nouveau code envoyé");
        else if (currentIndex === 2 && (label.includes("Continuer") || label.includes("Configurer plus tard") || aria === "Fermer")) navigate(3);
        else if (currentIndex === 3 && aria === "Filtres") navigate(5);
        else if (currentIndex === 3 && aria === "Afficher la liste") navigate(6);
        else if (currentIndex === 3 && (event.target.closest(".stationi-pin") || parkingRowElement)) navigate(7);
        else if (currentIndex === 3 && aria === "Recentrer") showToast("Position recentrée sur Alger Centre");
        else if (currentIndex === 4 && label.includes("Choisir sur la carte")) navigate(3);
        else if (currentIndex === 4 && (parkingRowElement || card)) navigate(7);
        else if (currentIndex === 5 && label.includes("Afficher 12 parkings")) navigate(6);
        else if (currentIndex === 5 && aria === "Réinitialiser") showToast("Filtres réinitialisés");
        else if (currentIndex === 6 && (label === "Voir" || parkingRowElement || card)) navigate(7);
        else if (currentIndex === 7 && label.includes("Réserver une place")) navigate(8);
        else if (currentIndex === 7 && aria === "Favori") showToast("Parking ajouté aux favoris");
        else if (currentIndex === 8 && label.includes("Choisir")) navigate(9);
        else if (currentIndex === 9 && label.includes("Changer")) navigate(10);
        else if (currentIndex === 9 && label.includes("Continuer")) navigate(11);
        else if (currentIndex === 10 && label.includes("Utiliser ce véhicule")) navigate(9);
        else if (currentIndex === 10 && (label.includes("Renault") || label.includes("Peugeot"))) showToast("Véhicule sélectionné");
        else if (currentIndex === 11 && label.includes("Payer")) {
          sessionState = "reserved";
          navigate(12);
        }
        else if (currentIndex === 11 && card) showToast("Moyen de paiement sélectionné");
        else if (currentIndex === 12 && label.includes("Itinéraire")) {
          sessionState = "navigating";
          navigate(13);
        }
        else if (currentIndex === 12 && (label.includes("Calendrier") || label.includes("Partager"))) showToast(label.includes("Calendrier") ? "Ajouté au calendrier" : "Lien de réservation copié");
        else if (currentIndex === 13 && label.includes("Démarrer")) navigate(14);
        else if (currentIndex === 13 && aria === "Options") showToast("Options d’itinéraire");
        else if (currentIndex === 14 && (card || event.target.closest(".stationi-map-sheet"))) {
          sessionState = "active";
          navigate(15);
        }
        else if (currentIndex === 14 && aria === "Muet") showToast("Guidage vocal désactivé");
        else if (currentIndex === 15 && label.includes("Prolonger")) navigate(16);
        else if (currentIndex === 15 && label.includes("Terminer")) {
          sessionState = "completed";
          navigate(17);
        }
        else if (currentIndex === 15 && label.includes("Ma voiture")) navigate(14);
        else if (currentIndex === 16 && (label.includes("Prolonger jusqu") || label.includes("Garder 16:30"))) {
          if (label.includes("Prolonger jusqu")) showToast("Session prolongée jusqu’à 17:30");
          navigate(15);
        }
        else if (currentIndex === 16 && card) showToast("Durée de prolongation sélectionnée");
        else if (currentIndex === 17 && label.includes("Réserver à nouveau")) navigate(9);
        else if (currentIndex === 17 && (label.includes("Télécharger") || aria === "Action")) showToast("Reçu téléchargé");
        else if (currentIndex === 18 && label.includes("Publier mon avis")) {
          showToast("Merci, votre avis est publié");
          setTimeout(() => navigate(20), 650);
        }
        else if (currentIndex === 18 && label.includes("Signaler un problème")) navigate(23);
        else if (currentIndex === 19 && label === "Réserver") navigate(9);
        else if (currentIndex === 19 && (label === "Voir" || parkingRowElement || card)) navigate(7);
        else if (currentIndex === 19 && label.includes("Découvrir")) navigate(3);
        else if (currentIndex === 20 && label.includes("Réserver encore")) navigate(9);
        else if (currentIndex === 20 && (label.includes("Voir le reçu") || parkingRowElement || card)) navigate(17);
        else if (currentIndex === 21 && card) {
          const cards = [...grid.querySelectorAll(".stationi-card")];
          navigate([16, 15, 17, 7][Math.max(0, cards.indexOf(card))] ?? 15);
        }
        else if (currentIndex === 22 && menuRowElement) {
          if (label.includes("Mes véhicules")) navigate(10);
          else if (label.includes("Factures")) navigate(20);
          else if (label.includes("Moyens de paiement")) navigate(11);
          else showToast(`${label.split("\n")[0]} ouvert`);
        }
        else if (currentIndex === 22 && (label.includes("Modifier") || label.includes("Ajouter du crédit"))) showToast(label.includes("Modifier") ? "Profil prêt à être modifié" : "Recharge du solde ouverte");
        else if (currentIndex === 23 && menuRowElement) {
          if (label.includes("Apparence")) applyTheme(root.dataset.theme === "dark" ? "light" : "dark");
          else showToast(`${normalize(menuRowElement.querySelector("strong")?.textContent || "Option")} ouvert`);
        }
        else if (currentIndex === 23 && label.includes("Supprimer mon compte")) showToast("Action désactivée dans le prototype");
        else if (button) showToast("Interaction disponible dans le prototype final");
      });

      document.addEventListener("keydown", (event) => {
        if (event.target.matches("input, select, textarea")) return;
        if (event.key === "ArrowRight") navigate(currentIndex + 1);
        if (event.key === "ArrowLeft" || event.key === "Escape") goBack();
      });

      const savedTheme = localStorage.getItem("stationi-theme");
      applyTheme(savedTheme === "dark" ? "dark" : "light", false);
    })();
  </script>
</div>
</body>
</html>
